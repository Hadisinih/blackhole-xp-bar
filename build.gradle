plugins {
    id 'fabric-loom' version '1.13-SNAPSHOT'
}

version = '1.0.0'
group = 'dev.blackholexp'

base {
    archivesName = 'blackhole-xp-bar'
}

repositories {
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.11"
    mappings "net.fabricmc:yarn:1.21.11+build.4:v2"
    modImplementation "net.fabricmc:fabric-loader:0.18.1"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.139.5+1.21.11"
    // Mod Menu dipakai hanya untuk kompilasi (tombol pengaturan); tidak wajib dipasang pemain.
    modCompileOnly "com.terraformersmc:modmenu:17.0.0"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
